<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Touge Kart 峠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  color-scheme: dark;
  --ink:#0b0a14; --pink:#ff3d81; --cyan:#28e7ff; --amber:#ffb020;
  --paper:#f4f1ec; --muted:#9a96b0; --panel:rgba(14,12,26,.82);
  --font:"Chakra Petch","Noto Sans JP",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--font);font-weight:500;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(ellipse at 50% 30%,rgba(11,10,20,.55),rgba(11,10,20,.93));overflow-y:auto;touch-action:manipulation}
.card{width:min(420px,100%);margin:auto}
.hero{position:relative;padding:8px 0 18px}
.kanji{position:absolute;right:-6px;top:-34px;font-size:150px;line-height:1;font-weight:700;color:transparent;
  -webkit-text-stroke:2px rgba(255,61,129,.55);pointer-events:none}
h1{margin:0;font-size:46px;line-height:1;font-weight:700;font-style:italic;letter-spacing:-.5px;transform:skewX(-6deg);transform-origin:left}
.stripe{height:6px;margin-top:12px;width:210px;background:repeating-linear-gradient(90deg,var(--paper) 0 26px,transparent 26px 44px);transform:skewX(-20deg)}
.sub{margin:12px 0 0;color:var(--muted);font-size:15px}
.field{margin-top:16px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=password],input[type=tel]{width:100%;padding:12px 14px;background:#15132a;border:1px solid #34304f;border-radius:4px;
  font-size:18px;-webkit-user-select:text;user-select:text}
#pin{font-size:30px;letter-spacing:.35em;text-align:center;font-weight:700;color:var(--cyan)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;padding:0}
.sw[aria-pressed=true]{border-color:var(--paper);box-shadow:0 0 0 2px var(--ink) inset}
.btn{display:block;width:100%;padding:14px 16px;font-weight:700;font-size:17px;background:var(--pink);color:var(--ink);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.btn:active{filter:brightness(.9)}
.btn.alt{background:#2a2744;color:var(--paper)}
.btn.sm{padding:9px 14px;font-size:15px;display:inline-block;width:auto}
.row{display:flex;gap:10px;margin-top:12px}
.row>*{flex:1}
#msg{min-height:22px;margin-top:10px;font-size:15px;color:var(--amber)}
details{margin-top:14px;border-top:1px solid #2c2945;padding-top:12px}
summary{cursor:pointer;color:var(--muted);font-size:15px}
.panel{margin-top:12px;padding:12px;background:#15132a;border:1px solid #34304f;border-radius:4px}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}

#hud{position:fixed;inset:0;pointer-events:none}
#hud button{pointer-events:auto}
.tl{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--panel);padding:8px 12px;border-left:4px solid var(--pink)}
#lap{font-size:20px;font-weight:700}
#pos{font-size:15px;color:var(--cyan)}
.tr{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--panel);padding:8px 12px;border-right:4px solid var(--cyan);text-align:right}
#spd{font-size:30px;font-weight:700;line-height:1;font-style:italic}
.tr small{color:var(--muted)}
#abort{margin-top:8px}
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;font-size:clamp(64px,18vw,140px);font-weight:700;font-style:italic;
  color:var(--paper);text-shadow:0 0 28px var(--pink),0 4px 0 var(--pink)}
#bar{position:absolute;left:50%;transform:translateX(-50%);top:calc(86px + env(safe-area-inset-top,0px));width:min(440px,calc(100% - 24px));
  background:var(--panel);padding:12px;border-top:3px solid var(--cyan)}
#room{font-size:20px;font-weight:700}
#roster{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;background:#1d1a35;border-radius:20px;font-size:14px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
#results{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 24px));
  background:var(--panel);padding:16px;border-top:3px solid var(--pink);pointer-events:auto}
#results h2{margin:0 0 8px;font-size:22px}
#resList{margin:0 0 12px;padding-left:22px}
#resList li{margin:4px 0}
#resList span{color:var(--muted);float:right}

#touch{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
  padding:12px calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));
  pointer-events:none}
.grp{display:flex;gap:14px;pointer-events:auto}
.tb{width:100px;height:100px;border-radius:50%;background:rgba(244,241,236,.16);border:2px solid rgba(244,241,236,.45);
  font-size:34px;font-weight:700;touch-action:none;display:flex;align-items:center;justify-content:center;color:var(--paper)}
.tb.on{background:var(--pink);border-color:var(--paper);color:var(--ink)}
.tb.wide{width:112px;height:112px;font-size:16px;line-height:1.05;padding:10px;text-align:center}
/* palanca analógica estilo DualShock */
.stick{position:relative;flex:0 0 auto;width:112px;height:112px;border-radius:50%;pointer-events:auto;touch-action:none;
  background:radial-gradient(circle at 50% 26%,#3b3b47,#1c1c23 60%,#101016 100%);
  border:2px solid rgba(244,241,236,.20);
  box-shadow:inset 0 2px 5px rgba(255,255,255,.15),inset 0 -4px 10px rgba(0,0,0,.75),0 8px 18px rgba(0,0,0,.55)}
.stick::before{content:'';position:absolute;inset:9px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,0,0,.62),rgba(0,0,0,.2) 72%,rgba(255,255,255,.05) 100%);
  box-shadow:inset 0 4px 8px rgba(0,0,0,.85),inset 0 -2px 6px rgba(255,255,255,.08)}
.stick::after{content:'◀   ▶';position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;
  letter-spacing:2px;color:rgba(244,241,236,.32);pointer-events:none}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 36% 28%,#8f8f9c,#4a4a57 52%,#23232b 83%,#17171d 100%);
  box-shadow:0 4px 10px rgba(0,0,0,.7),inset 0 2px 3px rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.55)}
.knob.snap{transition:transform .18s cubic-bezier(.2,1.6,.4,1)}
.knob span{position:absolute;inset:6px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.10) 0 4deg,rgba(0,0,0,.17) 4deg 8deg);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),inset 0 2px 5px rgba(0,0,0,.5),inset 0 -1px 2px rgba(255,255,255,.25)}
.stick.on{border-color:rgba(255,61,129,.7);
  box-shadow:inset 0 2px 5px rgba(255,255,255,.15),inset 0 -4px 10px rgba(0,0,0,.75),0 0 22px rgba(255,61,129,.35)}
.stick.on .knob{box-shadow:0 4px 12px rgba(0,0,0,.75),inset 0 2px 3px rgba(255,255,255,.5),inset 0 -3px 6px rgba(0,0,0,.55),0 0 14px rgba(255,61,129,.45)}
.cars{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.cars::-webkit-scrollbar{display:none}
.carSel{flex:0 0 auto;padding:9px 11px;background:#15132a;border:1px solid #34304f;border-radius:4px;
  font-size:13px;font-weight:700;white-space:nowrap;color:var(--muted)}
.carSel[aria-pressed=true]{border-color:var(--pink);background:#2a1c33;color:var(--pink)}
#slowTag{font-size:12px;color:#7cff6b;margin-top:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(150px + env(safe-area-inset-top,0px));
  padding:9px 15px;background:rgba(11,10,20,.93);border:1px solid var(--cyan);border-radius:20px;font-size:14px;
  z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#bBomb{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));
  width:84px;height:84px;border-radius:50%;font-size:30px;z-index:50;color:var(--paper);
  background:rgba(124,255,107,.14);border:2px solid rgba(124,255,107,.45);
  display:flex;align-items:center;justify-content:center;touch-action:none;padding:0}
#bBomb.ready{background:rgba(124,255,107,.4);border-color:#7cff6b;box-shadow:0 0 20px rgba(124,255,107,.55)}
#bombN{position:absolute;right:-3px;top:-3px;min-width:24px;height:24px;border-radius:12px;background:var(--pink);
  color:var(--ink);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.trk{font-size:13px;padding:8px 4px}
@media (max-width:430px){
  .tb{width:74px;height:74px;font-size:26px}
  .tb.wide{width:82px;height:82px;font-size:13px;padding:6px}
  .grp{gap:8px}
  .stick{width:100px;height:100px}
  .knob{width:52px;height:52px;margin:-26px 0 0 -26px}
  .stick::after{bottom:4px;font-size:9px}
  #bBomb{width:76px;height:76px;bottom:calc(130px + env(safe-area-inset-bottom,0px))}
}
/* ficha técnica del auto en el menú */
#carStats{margin-top:9px;display:grid;gap:5px}
.statCap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8f8aa3}
.statRow{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#b9b4c9}
.statBar{height:6px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden}
.statBar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#ff3d81,#28e7ff);transition:width .18s ease}
#bombIcon{display:block;font-size:31px;line-height:1.02}
#bBomb.gold{border-color:#ffd35e;box-shadow:0 0 24px rgba(255,211,94,.65);background:rgba(255,211,94,.22)}
#bBomb.gold #bombIcon{font-size:44px;filter:drop-shadow(0 0 8px rgba(255,211,94,.9))}
/* celular en horizontal: todo más compacto para que la pista se vea entera */
@media (orientation:landscape) and (max-height:520px){
  #menu{padding:8px calc(16px + env(safe-area-inset-left,0px)) 8px calc(16px + env(safe-area-inset-right,0px))}
  /* el menú en dos columnas: entra entero, sin scrollear */
  .card{display:flex;flex-wrap:wrap;align-content:flex-start;column-gap:14px;width:min(700px,100%)}
  .hero{flex:1 1 100%;padding:0 0 3px}
  .sub,.stripe{display:none}
  h1{font-size:26px}
  .kanji{font-size:74px;top:-14px;right:0}
  .field{flex:1 1 44%;margin-top:5px}
  .field:has(#cars){flex:1 1 100%}
  label{font-size:12px;margin-bottom:3px}
  input[type=text],input[type=password],input[type=tel]{padding:8px 11px;font-size:15px}
  #pin{font-size:20px}
  .sw{width:26px;height:26px}
  .swatches{gap:8px}
  .carSel{padding:5px 9px;font-size:12px}
  /* la ficha del auto en una sola fila de tres barras */
  #carStats{flex:1 1 100%;grid-template-columns:repeat(3,1fr);gap:4px 8px;margin-top:4px}
  .statCap{grid-column:1/-1;font-size:10px;margin-bottom:-2px}
  .statRow{grid-template-columns:1fr;gap:2px;font-size:9px;letter-spacing:.02em}
  .statBar{height:4px}
  #msg{flex:1 1 100%;min-height:0;margin-top:4px;font-size:13px}
  #joinBtn{flex:1 1 100%;margin-top:1px}
  .btn{padding:9px 14px;font-size:15px}
  .row{flex:1 1 100%;margin-top:5px}
  #adminBox{flex:1 1 100%;margin-top:3px;padding-top:5px}
  summary{font-size:13px}
  details .panel{margin-top:6px;padding:8px}
  #touch{padding:6px calc(10px + env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px))}
  .stick{width:92px;height:92px}
  .knob{width:48px;height:48px;margin:-24px 0 0 -24px}
  .tb{width:84px;height:84px;font-size:27px}
  .tb.wide{width:90px;height:90px;font-size:13px;padding:6px}
  #bBomb{width:68px;height:68px;font-size:26px;bottom:calc(110px + env(safe-area-inset-bottom,0px))}
  #bombN{min-width:20px;height:20px;font-size:11px}
  .tl,.tr{padding:6px 10px}
  #lap{font-size:16px}
  #pos{font-size:13px}
  #spd{font-size:22px}
  #bar{top:calc(66px + env(safe-area-inset-top,0px));width:min(520px,calc(100% - 220px));padding:8px}
  #room{font-size:16px}
  #banner{font-size:clamp(46px,13vw,92px)}
  #results{padding:12px}
  #toast{top:calc(70px + env(safe-area-inset-top,0px));font-size:13px}
}
/* pantallas de celular muy bajas en horizontal: apretamos un poco más */
@media (orientation:landscape) and (max-height:380px){
  #menu{padding-top:6px;padding-bottom:6px}
  h1{font-size:23px}
  .kanji{font-size:64px;top:-10px}
  .hero{padding:0}
  .field{margin-top:4px}
  .row{margin-top:4px}
  #carStats{margin-top:3px}
}
/* celulares chicos en vertical: la ficha del auto en una fila, menos scroll */
@media (orientation:portrait) and (max-height:700px){
  h1{font-size:30px}
  .kanji{font-size:88px;top:-16px}
  .stripe{width:150px;margin-top:6px}
  .sub{margin-top:8px;font-size:13px}
  .field{margin-top:10px}
  input[type=text],input[type=password],input[type=tel]{padding:10px 12px;font-size:16px}
  #pin{font-size:24px}
  .sw{width:30px;height:30px}
  .carSel{padding:6px 10px;font-size:13px}
  .btn{padding:11px 14px;font-size:16px}
  #carStats{grid-template-columns:repeat(3,1fr);gap:4px 8px;margin-top:6px}
  .statCap{grid-column:1/-1;font-size:10px;margin-bottom:-2px}
  .statRow{grid-template-columns:1fr;gap:2px;font-size:9px;letter-spacing:.02em}
  .statBar{height:4px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div class="card">
    <div class="hero">
      <div class="kanji" aria-hidden="true">峠</div>
      <h1>Touge Kart</h1>
      <div class="stripe"></div>
      <p class="sub">Carreras nocturnas de GT entre amigos.</p>
    </div>

    <div class="field">
      <label for="pin">PIN de la sala</label>
      <input id="pin" type="tel" inputmode="numeric" maxlength="6" placeholder="······" autocomplete="off">
    </div>
    <div class="field">
      <label for="nick">Tu apodo</label>
      <input id="nick" type="text" maxlength="12" placeholder="Ej: Takumi" autocomplete="off">
    </div>
    <div class="field">
      <label>Color del auto</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="field">
      <label>Modelo</label>
      <div class="cars" id="cars"></div>
      <div id="carStats"></div>
    </div>

    <div id="msg" role="status"></div>
    <button class="btn" id="joinBtn">Entrar a la sala</button>
    <div class="row"><button class="btn alt" id="practiceBtn">Probar solo</button></div>

    <details id="adminBox">
      <summary>Administración</summary>
      <div id="adminLogin" class="panel">
        <label for="admcode">Código de administrador</label>
        <input id="admcode" type="password" autocomplete="off" placeholder="XXXXX-XXXXX">
        <div class="row"><button class="btn alt sm" id="admBtn">Validar código</button></div>
      </div>
      <div id="adminTools" class="panel" hidden>
        <div>Modo administrador activo</div>
        <div class="row"><button class="btn sm" id="createBtn">Crear sala nueva</button></div>
        <p class="note">Se genera un PIN de 6 dígitos. Tu celular es el anfitrión: la sala se cierra si sales o cierras la página.</p>
      </div>
    </details>
  </div>
</div>

<div id="hud" hidden>
  <div class="tl"><div id="lap">Vuelta 1/3</div><div id="pos">1º de 1</div><div id="slowTag" hidden></div></div>
  <div class="tr"><div><span id="spd">0</span> <small>km/h</small></div><button class="btn alt sm" id="abort" hidden>Reiniciar</button></div>
  <div id="banner"></div>
  <button id="bBomb" hidden aria-label="Usar fruta"><span id="bombIcon">🍉</span><span id="bombN">0</span></button>
  <div id="bar">
    <div id="room"></div>
    <div id="roster"></div>
    <div class="row" id="tracks" hidden>
      <button class="btn alt sm trk" data-i="0">Touge</button>
      <button class="btn alt sm trk" data-i="1">Costa</button>
      <button class="btn alt sm trk" data-i="2">Pueblo</button>
    </div>
    <p class="note" id="trackName"></p>
    <div class="row">
      <button class="btn sm" id="startBtn" hidden>Iniciar carrera</button>
      <button class="btn alt sm" id="copyPin" hidden>Copiar PIN</button>
      <button class="btn alt sm" id="exitBtn">Salir</button>
    </div>
    <p class="note" id="waitNote" hidden>Esperando que el anfitrión inicie la carrera.</p>
  </div>
  <div id="results" hidden>
    <h2>Llegada</h2>
    <ol id="resList"></ol>
    <button class="btn sm" id="againBtn" hidden>Volver a la sala</button>
  </div>
</div>

<div id="touch" hidden>
  <div class="grp"><div class="stick" id="stick" aria-label="Palanca de dirección"><div class="knob" id="knob"><span></span></div></div></div>
  <div class="grp"><button class="tb wide" id="bB">Freno y drift</button><button class="tb wide" id="bG">Gas</button></div>
</div>

<div id="toast" hidden></div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');

/* Huellas SHA-256 de los códigos de administrador (los códigos no están en el archivo). */
const ADMIN_HASHES = ["e7a2c64ce89a417f7c104f4c83a678c654725d712148b02d88531b13980e1d59","29c9c81bbde587248e2851ef7402fe57980aaad6cb23ac674319802b76b18fe3","2b6c529357e45375ca2cbd60a722e1dc75012bc903b6df34705d2debf2e37258","57ff72115a0f3f1229bfa1128d75af73f0ff734ae888e6850eb70067c7aa4bfe","ccac231685eb8a9e433f48d640c25f76286e4342c8b5afe391e06e7b9a4632f9"];
const PREFIX = 'tgkrt-';
const MAX_PLAYERS = 8;

/* ================= pistas ================= */
const LAPS = 3, TW = 190, SEG = 24;
const TRACKS = [
  {n:'Touge', seed:7,
   theme:{kind:'mountain',bg:'#0b0a14',sky0:'#080610',sky1:'#241a44',edge:'#ff3d81',road:'#25242f',line:'#f4f1ec'},
   CP:[[0,0],[600,-40],[1200,-40],[1700,100],[1950,450],[1750,800],[1250,850],[1000,1100],[1200,1450],[900,1700],[400,1650],[100,1300],[250,900],[-200,650],[-450,300],[-300,-100]]},
  {n:'Costa', seed:31,
   theme:{kind:'coast',bg:'#04121c',sky0:'#040e18',sky1:'#0b3550',edge:'#28e7ff',road:'#1e2a31',line:'#c9f7ff'},
   CP:[[0,0],[700,-60],[1400,-40],[1900,240],[2000,700],[1750,1080],[1300,1150],[1050,1450],[700,1620],[350,1450],[300,1150],[-100,1000],[-450,700],[-500,300],[-350,-60],[-150,-120]]},
  {n:'Pueblo', seed:53,

function joinRoom(pin){

  let attempt=0,done=false,to=null;
  const MAX=3;

  const retryOrFail=m=>{
    if(done) return;

      dbg('error invitado '+e.type);

      if(done&&S.mode==='play') leave('Se perdió la conexión.');

      const conn=p.connect(PREFIX+pin,{reliable:true});

        if(!settle()) return;
        done=true;dbg('canal abierto');

        conn.send({t:'hello',n:S.name,c:S.color,k:S.carType});
        timers.push(setInterval(()=>{
          const c=S.car;
          try{conn.send({t:'s',x:Math.round(c.x),y:Math.round(c.y),a:+c.a.toFixed(2),l:S.lap,p:S.prog,f:S.fin?1:0,ft:+S.ft.toFixed(2),it:itemCode(S.item)});}catch(e){}
        },50));
        conn.on('close',()=>{ if(S.mode==='play') leave('La sala se cerró.'); else stop('No se pudo entrar a la sala.'); });
        enterUI();
      });
      conn.on('data',onGuestData);
    });
    to=setTimeout(()=>{
      if(!settle()) return;
      dbg('sin respuesta');
      try{p.destroy();}catch(e){}
      retryOrFail('No se encontró la sala. Revisá el PIN o pedile al anfitrión que deje la pestaña abierta.');
    },15000);
  };
  tryOnce();
}
function onGuestData(m){
  if(!m||typeof m!=='object') return;
  if(m.t==='full'){ leave('La sala está llena.'); return; }
  if(m.t==='color'){ S.color=okc(m.c); dbg('color asignado '+S.color); toast('Ese color ya estaba en uso: te toca '+colorName(S.color)); return; }
  if(m.t==='kick'){ leave('El anfitrión te sacó de la sala.'); return; }
  if(m.t!=='st'||!Array.isArray(m.p)||!m.g) return;
  clockSamples.push(num(m.now)-Date.now()); if(clockSamples.length>40) clockSamples.shift();
  S.clockOff=Math.max(...clockSamples);
  const g={state:m.g.state==='race'?'race':'lobby',startAt:num(m.g.startAt),seq:num(m.g.seq),track:num(m.g.track)};
  if(g.track!==S.game.track){ buildTrack(g.track); }
  const me=m.p.find(e=>e&&e.id===S.myId);
  const newSlot=me?num(me.sl):S.slot;
  const changed=g.state!==S.game.state||g.startAt!==S.game.startAt||g.seq!==S.game.seq||g.track!==S.game.track;
  if(changed){S.game=g;S.fin=false;S.ft=0;S.item=null;S.nitro=0;S.flip=0;S.slow=0;S.lastLap=0;}
  if(Array.isArray(m.bx)) S.bx=m.bx;
  if(newSlot!==S.slot){S.slot=newSlot;}
  if(changed||(me&&S.gridSlot!==newSlot)){ if(g.state==='lobby'||ntime()<g.startAt) placeOnGrid(); }
  if(me){
    if(me.c) S.color=okc(me.c);
    S.item=parseItem(me.it);
    if(!S.host) S.slow=num(me.b);
  }
  if(Array.isArray(m.ev)) for(const e of m.ev){
    if(!e||seenEv.has(e.i)) continue;
    seenEv.add(e.i);
    const mine2 = e.q===S.myId;
    if(e.k==='boost'){ if(mine2){ S.nitro=e.g?4:2.5; toast('¡Turbo'+(e.g?' dorado':'')+'! ⚡'); } }
    else if(e.k==='flip'){ if(mine2){ S.flip=e.g?9:6; toast('¡Volante invertido'+(e.g?' (dorado)':'')+'! 🌀'); } animBomb(String(e.f),String(e.q),e.g); }
    else { if(mine2) toast('¡Te dieron con una fruta! 🍉'); animBomb(String(e.f),String(e.q),e.g); }
  }
  S.others=m.p.filter(e=>e&&e.id!==S.myId).map(e=>({id:String(e.id),n:cleanName(e.n),c:okc(e.c),k:e.k,b:num(e.b),x:typeof e.x==='number'?e.x:null,y:num(e.y),a:num(e.a),l:num(e.l),p:num(e.p),f:e.f?1:0,t:num(e.t)}));
  renderRoster();
}

/* ================= parrilla y física ================= */
function placeOnGrid(){
  const s=S.slot;S.gridSlot=s;
  const idx=((N-4-Math.floor(s/2)*3)%N+N)%N;
  const t=tg[idx],nx=-t[1],ny=t[0],side=(s%2?-1:1)*38;
  const c=S.car;
  c.x=pts[idx][0]+nx*side;c.y=pts[idx][1]+ny*side;c.a=Math.atan2(t[1],t[0]);c.vx=0;c.vy=0;
  S.lap=0;S.prog=idx;S.lastLap=1;   /* la parrilla está antes de la meta: ese primer cruce no da fruta */
}
function nearest(x,y,from){
  let best=1e18,bi=from;
  for(let k=-30;k<=30;k++){const i=(from+k+N)%N;const dx=pts[i][0]-x,dy=pts[i][1]-y,d=dx*dx+dy*dy;if(d<best){best=d;bi=i;}}
  return bi;
}
function input(){
  /* la palanca manda cuando está tomada; si no, el teclado */
  const ax=stickAxis()||((kb.right?1:0)-(kb.left?1:0));
  return {axis:ax,gas:kb.gas||tc.gas,brake:kb.brake||tc.brake};
}
const LIM=TW/2+14;
function update(dt){
  const g=S.game,now=ntime();
  const T=carOf(S.carType), slowK=S.slow>0?.62:1;
  if(S.cd>0) S.cd=Math.max(0,S.cd-dt);
  if(S.nitro>0) S.nitro=Math.max(0,S.nitro-dt);
  if(S.flip>0) S.flip=Math.max(0,S.flip-dt);
  /* en práctica no hay anfitrión que corra el reloj de las cajas: lo hacemos acá */
  if(S.practice) for(const b of boxes) if(b.ms>0) b.ms=Math.max(0,b.ms-dt*1000);
  const rem=g.state==='race'?g.startAt-now:1e9;
  const can=g.state==='race'&&rem<=0&&!S.fin;
  const inp=can?input():{axis:0,gas:0,brake:0};
  const c=S.car;
  let fx=Math.cos(c.a),fy=Math.sin(c.a);
  let vf=c.vx*fx+c.vy*fy;
  const steer=inp.axis*(S.flip>0?-1:1);   /* fruta de cambio de sentido: volante invertido */
  const spd=Math.abs(vf);
  c.a+=steer*T.steer*Math.min(1,spd/140)*(vf>=0?1:-1)*(1-Math.min(.35,spd/1400))*dt;
  fx=Math.cos(c.a);fy=Math.sin(c.a);
  vf=c.vx*fx+c.vy*fy;
  let vl=c.vx*-fy+c.vy*fx;
  const topNow = T.top*slowK*(S.nitro>0?1.34:1);
  if(inp.gas&&vf<topNow) vf+=T.acc*(S.slow>0?.72:1)*(S.nitro>0?2.1:1)*dt;
  if(inp.brake) vf=Math.max(vf-(vf>0?520:200)*dt,-120);
  vf*=Math.exp(-(inp.gas?.25:.9)*dt);
  const drifting=!!(inp.brake&&steer&&vf>150);
  vl*=Math.exp(-(drifting?T.grip*.22:T.grip)*dt);
  c.vx=fx*vf-fy*vl;c.vy=fy*vf+fx*vl;
  c.x+=c.vx*dt;c.y+=c.vy*dt;

  /* muros: el auto no puede salir de la ruta y el choque le quita velocidad al instante */
  const ni=nearest(c.x,c.y,S.prog);
  const p=pts[ni],t=tg[ni],nx=-t[1],ny=t[0];
  const rx=c.x-p[0],ry=c.y-p[1];
  const along=rx*t[0]+ry*t[1];
  let lat=rx*nx+ry*ny;
  if(Math.abs(lat)>LIM){
    const sg=lat>0?1:-1;lat=sg*LIM;
    c.x=p[0]+t[0]*along+nx*lat;c.y=p[1]+t[1]*along+ny*lat;
    const wx=nx*sg,wy=ny*sg,vn=c.vx*wx+c.vy*wy;
    if(vn>0){
      c.vx-=wx*vn*1.15;c.vy-=wy*vn*1.15;
      const k=Math.max(.4,1-vn/400);c.vx*=k;c.vy*=k;
      if(vn>60&&parts.length<160) for(let i=0;i<4;i++) parts.push({x:c.x+wx*14,y:c.y+wy*14,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,l:.5,sp:true});
    }
    const f=Math.exp(-2.2*dt);c.vx*=f;c.vy*=f;
  }
  if(S.prog>N*.75&&ni<N*.25) S.lap++; else if(S.prog<N*.25&&ni>N*.75) S.lap--;
  const dp=((ni-S.prog)%N+N)%N;
  S.prog=ni;
  if((S.host||S.practice)&&S.slow>0&&dp>0&&dp<N/2) S.slow=Math.max(0,S.slow-dp);
  if((S.host||S.practice)&&g.state==='race'&&S.lap>S.lastLap){
    S.lastLap=S.lap;
    if(!S.item){ S.item=rollItem(); toast('¡Fruta '+itemEmoji(S.item)+'! '+cap(itemLabel(S.item))); }
    else toast('Ya tenés una fruta: usala antes de cruzar otra meta');
  }
  /* cajas de frutas: sólo el anfitrión (o la práctica) las reparte */
  if((S.host||S.practice)&&g.state==='race'&&!S.fin&&ntime()>=g.startAt&&!S.item){
    const bx2=takeBoxAt(c.x,c.y);
    if(bx2){ S.item=rollItem(bx2.gold); toast('¡Caja'+(bx2.gold?' dorada':'')+' abierta! '+itemEmoji(S.item)+' '+cap(itemLabel(S.item))); }
  }
  if(S.lap>LAPS&&!S.fin&&g.state==='race'){S.fin=true;S.ft=(now-g.startAt)/1000;}

  if(drifting&&parts.length<160){
    parts.push({x:c.x-fx*18+(Math.random()-.5)*8,y:c.y-fy*18+(Math.random()-.5)*8,l:1});
  }
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=dt*(q.sp?2:1.4);if(q.sp){q.x+=q.vx*dt;q.y+=q.vy*dt;}if(q.l<=0)parts.splice(i,1);}
}

/* ================= clasificación ================= */
function others(){
  if(S.practice) return [];
  if(S.host) return [...players.values()];
  return S.others;
}
function entries(){
  const list=[{me:true,id:S.myId,n:S.name,c:S.color,k:S.carType,b:Math.round(S.slow),score:S.lap*N+S.prog,f:!!S.fin,t:S.ft}];
  for(const o of others()){
    if(typeof o.x!=='number') continue;
    list.push({n:o.n,c:o.c,k:o.k,b:num(o.b),score:o.l*N+o.p,f:!!o.f,t:o.t,id:o.id,x:o.x,y:o.y,a:o.a});
  }
  list.sort((a,b)=>((b.f?1:0)-(a.f?1:0))||(a.f&&b.f?a.t-b.t:b.score-a.score));
  return list;
}
function toast(t){
  const el=$('toast'); if(!el) return;
  el.textContent=t; el.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>{el.hidden=true;},2800);
}
const bombsV=[];                 /* fruta en vuelo (visual, en todos los clientes) */
const seenEv=new Set();          /* eventos ya animados */
function posOf(id){
  if(id===S.myId) return {x:S.car.x,y:S.car.y};
  const r=R[id]; if(r) return {x:r.x,y:r.y};
  for(const o of others()) if(String(o.id)===String(id)&&typeof o.x==='number') return {x:o.x,y:o.y};
  return null;
}
function animBomb(f,q,gold){
  const a=posOf(f), b=posOf(q); if(!a||!b) return;
  bombsV.push({x0:a.x,y0:a.y,x1:b.x,y1:b.y,t:0,dur:.62,gold:gold?1:0});
  if(bombsV.length>8) bombsV.shift();
}
let evSeq=0, evBuf=[];
function pushEv(f,q,k,g){ evSeq++; evBuf.push({f,q,k,g:g?1:0,i:evSeq,at:Date.now()}); if(evBuf.length>8) evBuf.shift(); }
function pushBomb(f,q){ pushEv(f,q,'slow',0); }
const cap = t => t.charAt(0).toUpperCase()+t.slice(1);
/* la caja más cercana todavía disponible */
function boxAt(x,y){
  for(const b of boxes){
    if(b.ms>0) continue;
    const p=pts[b.i], t=tg[b.i];
    const bx2=p[0]-t[1]*b.lat, by2=p[1]+t[0]*b.lat;
    if(Math.hypot(x-bx2,y-by2)<30) return b;
  }
  return null;
}
function takeBoxAt(x,y){ const b=boxAt(x,y); if(!b) return null; b.ms=5200; return b; }
/* el anfitrión decide a quién le pega: al rival inmediatamente adelante (o al de atrás si vas 1º).
   Con fruta dorada el efecto va a todos los rivales. */
function hostUse(from){
  if(S.game.state!=='race'||ntime()<S.game.startAt) return false;
  const o = from==='h' ? null : players.get(from);
  const it = from==='h' ? S.item : parseItem(o&&o.item);
  if(!it) return false;
  if(it.k==='b'){                                        /* turbo: va para uno mismo, no necesita rivales */
    if(from==='h'){ S.item=null; S.nitro = it.g?4:2.5; } else o.item='';
    pushEv(from, from, 'boost', it.g);
    dbg('turbo '+from+(it.g?' dorado':''));
    return true;
  }
  const list=entries();
  const i=list.findIndex(e=>String(e.id)===String(from));
  let rivals=list.filter(e=>String(e.id)!==String(from));
  if(!rivals.length) return false;                       /* sin rivales no hay a quién apuntar */
  if(from==='h') S.item=null; else o.item='';
  let targs;
  if(it.g) targs = rivals;
  else { const t2 = i>=0 ? (list[i-1]||list[i+1]) : null; targs = (t2&&String(t2.id)!==String(from)) ? [t2] : []; }
  if(!targs.length) return false;
  for(const t2 of targs){
    if(t2.id==='h'){ if(it.k==='s') S.slow=Math.max(S.slow,(it.g?.6:.75)*N); else S.flip=Math.max(S.flip,it.g?9:6); }
    else {
      const p2=players.get(t2.id);
      if(p2){ if(it.k==='s') p2.b=Math.max(p2.b,(it.g?.6:.75)*N); }
    }
    pushEv(from, t2.id, it.k==='s'?'slow':'flip', it.g);
    dbg('fruta '+it.k+' '+from+' -> '+t2.id);
    if(t2.id==='h') toast('¡'+t2.n+' te tiró una fruta!');
  }
  return true;
}
function useItem(){
  if(S.mode!=='play'||S.game.state!=='race'||ntime()<S.game.startAt) return;
  if(S.cd>0) return;
  if(!S.item){ toast('Abrí una caja 🧰 o cruzá una meta para conseguir fruta'); return; }
  if(S.practice && S.item.k!=='b'){ toast('En práctica no hay rivales. Probá el turbo ⚡'); return; }
  S.cd=.9;
  if(S.host||S.practice) hostUse('h');
  else { try{hostConn.send({t:'use'});}catch(e){} }
}
/* compatibilidad con el gancho de depuración */
const throwBomb = useItem;
function fmt(t){const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(2);}
function renderRoster(){
  const box=$('roster');box.textContent='';
  const all=[{n:S.name,c:S.color,me:true}].concat(others().map(o=>({n:o.n,c:o.c})));
  if(S.mode==='play') $('room').textContent=(S.practice?'Práctica en solitario':'Sala '+S.pin)+' · '+all.length+'/'+MAX_PLAYERS;
  for(const e of all){
    const s=document.createElement('span');s.className='chip';
    const i=document.createElement('i');i.style.background=e.c;
    s.appendChild(i);s.appendChild(document.createTextNode(e.n+(e.me?' (tú)':'')));
    box.appendChild(s);
  }
}

/* ================= dibujo ================= */
let W=0,H=0,DPR=1,camx=0,camy=0,camS=.6;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
}
addEventListener('resize',resize);resize();
/* al girar el celular el tamaño tarda en reportarse: reintentamos */
addEventListener('orientationchange',()=>{resize();setTimeout(resize,250);setTimeout(resize,600);});
if(window.visualViewport){visualViewport.addEventListener('resize',resize);visualViewport.addEventListener('scroll',resize);}

function wrapX(x,k){ return ((x - camx*k) % W + W) % W; }
function drawScenery(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,theme.sky0);g.addColorStop(.6,theme.sky1);g.addColorStop(1,theme.bg);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(!sc) return;
  const kind=sc.kind, hor=H*(kind==='coast'?.5:.6), t=performance.now()/1000;
  if(sc.stars.length){
    for(const st of sc.stars){
      const x=wrapX(st[0]*W,.03), y=st[1]*H*(kind==='coast'?.48:.62);
      ctx.globalAlpha=st[3]*(.5+.5*Math.sin(t*.8+st[0]*40));
      ctx.fillStyle='#ffffff';ctx.fillRect(x,y,st[2],st[2]);
    }
    ctx.globalAlpha=1;
  }
  if(kind==='mountain'){
    for(let layer=0;layer<2;layer++){
      const amp=H*(layer?.14:.09), baseY=hor+layer*H*.02, k=.05+layer*.07;
      ctx.fillStyle=layer?'#171226':'#241b38';
      ctx.beginPath();ctx.moveTo(0,H);
      for(let x=0;x<=W+8;x+=8){
        const ph=(x+camx*k)/W*Math.PI*2;
        ctx.lineTo(x, baseY - amp*(.62+.38*Math.sin(ph*2+layer*2.1)) - amp*.32*Math.sin(ph*5+layer));
      }
      ctx.lineTo(W,H);ctx.closePath();ctx.fill();
    }
    const mx=W*.76, my=H*.16, mr=Math.max(15,Math.min(W,H)*.042);
    ctx.globalAlpha=.10;ctx.fillStyle='#f6f0d8';ctx.beginPath();ctx.arc(mx,my,mr*2.6,0,6.3);ctx.fill();
    ctx.globalAlpha=.92;ctx.beginPath();ctx.arc(mx,my,mr,0,6.3);ctx.fill();ctx.globalAlpha=1;
  }else if(kind==='coast'){
    const sea=ctx.createLinearGradient(0,hor,0,H);
    sea.addColorStop(0,'#0d3a52');sea.addColorStop(1,'#04121c');
    ctx.fillStyle=sea;ctx.fillRect(0,hor,W,H-hor);
    for(const b of sc.blocks){
      const x=wrapX(b.f*W*1.5,.18), hh=b.h*H*.52;
      ctx.fillStyle='#0a2233';ctx.fillRect(x,hor-hh,b.w*W*1.2,hh);
      ctx.globalAlpha=.5;ctx.fillStyle='#ffd9a0';ctx.fillRect(x+3,hor-hh+4,3,3);ctx.globalAlpha=1;
    }
    const mx=W*.7, my=hor-H*.2, mr=Math.max(13,Math.min(W,H)*.036);
    ctx.fillStyle='#eef6ff';ctx.beginPath();ctx.arc(mx,my,mr,0,6.3);ctx.fill();
    for(let i=0;i<24;i++){
      const y=hor+i*(H-hor)/24, w=W*(.05+i*.0018)*(1-i*.02);
      ctx.globalAlpha=.16*(1-i/24);
      ctx.fillStyle='#bfe9ff';ctx.fillRect(mx-w/2+Math.sin(i*.7+t*1.2)*5,y,w,2.5);
    }
    ctx.globalAlpha=1;
  }else{
    for(const b of sc.blocks){
      const x=wrapX(b.f*W*1.7,.22), w=b.w*W*1.3, hh=b.h*H*.8;
      ctx.fillStyle='#150d1f';ctx.fillRect(x,hor-hh,w,hh);
      ctx.globalAlpha=.35;ctx.fillStyle=theme.edge;ctx.fillRect(x,hor-hh,w,2.5);ctx.globalAlpha=1;
      for(const wn of b.win){
        ctx.globalAlpha=.22+.45*wn[2];
        ctx.fillStyle=wn[2]>.72?'#ffe9b0':'#ffcf7a';
        ctx.fillRect(x+wn[0]*w-1.5, hor-hh+wn[1]*hh-2, 3, 4);
      }
      ctx.globalAlpha=1;
    }
    const hz=ctx.createLinearGradient(0,hor-H*.3,0,hor);
    hz.addColorStop(0,'rgba(176,133,255,0)');hz.addColorStop(1,'rgba(176,133,255,.2)');
    ctx.fillStyle=hz;ctx.fillRect(0,hor-H*.3,W,H*.3);
  }
  const fog=ctx.createLinearGradient(0,hor-H*.12,0,H);
  fog.addColorStop(0,'rgba(0,0,0,0)');fog.addColorStop(1,'rgba(0,0,0,.4)');
  ctx.fillStyle=fog;ctx.fillRect(0,hor-H*.12,W,H);
}
/* caja de fruta: dorada = doble tamaño */
function drawBox(x,y,ms,gold,t){
  if(ms>0) return;
  const r=13, sq=Math.abs(Math.cos(t*1.5+(x+y)*.01)), bob=Math.sin(t*2+(x+y)*.02)*3;
  ctx.save();ctx.translate(x,y+bob);
  if(gold){
    ctx.globalAlpha=.28;ctx.fillStyle='#ffe45e';ctx.beginPath();ctx.arc(0,0,r*2.2,0,6.3);ctx.fill();ctx.globalAlpha=1;
  }
  const hw=r*(.35+.65*sq)*(gold?2:1), hh=r*(gold?2:1);
  ctx.fillStyle=gold?'rgba(255,211,94,.9)':'rgba(255,255,255,.16)';
  ctx.strokeStyle=gold?'#fff3c0':theme.line;ctx.lineWidth=2.5;
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(-hw,-hh,hw*2,hh*2,5);ctx.fill();ctx.stroke();}
  else{ctx.fillRect(-hw,-hh,hw*2,hh*2);ctx.strokeRect(-hw,-hh,hw*2,hh*2);}
  const fr=r*(gold?.62:.55);
  ctx.fillStyle=gold?'#ffe45e':'#7cff6b';ctx.beginPath();ctx.arc(0,0,fr,0,6.3);ctx.fill();
  ctx.fillStyle=gold?'#ffb020':'#e8394f';ctx.beginPath();ctx.arc(fr*.15,-fr*.12,fr*.42,0,6.3);ctx.fill();
  if(gold){ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(-fr*.3,-fr*.35,fr*.16,0,6.3);ctx.fill();}
  ctx.restore();ctx.globalAlpha=1;
}
function drawRoad(){
  ctx.lineJoin='round';ctx.lineCap='butt';ctx.setLineDash([]);
  ctx.globalAlpha=.08;ctx.strokeStyle=theme.edge;ctx.lineWidth=TW+170;ctx.stroke(roadPath);
  ctx.globalAlpha=1;
  ctx.strokeStyle=theme.edge;ctx.lineWidth=TW+2*(LIM-TW/2)+60;ctx.stroke(roadPath);     /* borde del muro */
  ctx.strokeStyle='#0b0a14';ctx.lineWidth=TW+2*(LIM-TW/2)+52;ctx.stroke(roadPath);
  ctx.strokeStyle='#f4f1ec';ctx.lineWidth=TW+32;ctx.stroke(roadPath);
  ctx.strokeStyle='#e0213f';ctx.setLineDash([34,34]);ctx.stroke(roadPath);
  ctx.setLineDash([]);
  ctx.strokeStyle=theme.road;ctx.lineWidth=TW;ctx.stroke(roadPath);
  ctx.globalAlpha=.4;ctx.strokeStyle=theme.line;ctx.lineWidth=5;ctx.setLineDash([26,38]);ctx.stroke(roadPath);
  /* tres carriles */
  ctx.globalAlpha=.22;ctx.lineWidth=4;ctx.setLineDash([30,44]);
  if(laneA){ctx.stroke(laneA);ctx.stroke(laneB);}
  ctx.globalAlpha=1;ctx.setLineDash([]);
  const t=tg[0],nx=-t[1],ny=t[0],h=TW/2;
  ctx.save();ctx.lineCap='butt';
  ctx.beginPath();ctx.moveTo(pts[0][0]+nx*h,pts[0][1]+ny*h);ctx.lineTo(pts[0][0]-nx*h,pts[0][1]-ny*h);
  ctx.strokeStyle='#f4f1ec';ctx.lineWidth=24;ctx.stroke();
  ctx.strokeStyle='#0b0a14';ctx.setLineDash([24,24]);ctx.stroke();
  ctx.restore();
}
function drawCar(x,y,a,col,name,glow,type,slow,nitro){
  const T=carOf(type), L=T.L, W=T.W, hw=W/2, hl=L/2, nw=hw*T.nose;
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  if(nitro){ /* llamas del turbo */
    for(let i=0;i<3;i++){
      const k=.6+.4*Math.sin(performance.now()/40+i);
      ctx.globalAlpha=.5*k;ctx.fillStyle=i===1?'#ffe45e':'#ff6b35';
      ctx.beginPath();ctx.moveTo(-hl-2,-hw*.42);ctx.lineTo(-hl-16-k*14,0);ctx.lineTo(-hl-2,hw*.42);ctx.closePath();ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  if(slow){ /* aura de fruta */
    const pu=.5+.5*Math.sin(performance.now()/130);
    ctx.globalAlpha=.18+pu*.22;ctx.fillStyle='#7cff6b';
    ctx.beginPath();ctx.ellipse(0,0,hl*1.25,hw*1.55,0,0,6.3);ctx.fill();ctx.globalAlpha=1;
  }
  ctx.globalAlpha=.26;ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,0,hl*.95,hw*1.2,0,0,6.3);ctx.fill();ctx.globalAlpha=1;
  /* ruedas */
  ctx.fillStyle='#0d0c15';
  const wx=hl*.56, wy=hw*.96;
  ctx.fillRect(wx-6,-wy-3,12,6);ctx.fillRect(wx-6,wy-3,12,6);
  ctx.fillRect(-wx-6,-wy-3,12,6);ctx.fillRect(-wx-6,wy-3,12,6);
  /* carrocería */
  ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(hl,0);
  ctx.lineTo(hl-8,-nw);
  ctx.lineTo(-hl+6,-hw);
  ctx.lineTo(-hl,-hw*.72);
  ctx.lineTo(-hl,hw*.72);
  ctx.lineTo(-hl+6,hw);
  ctx.lineTo(hl-8,nw);
  ctx.closePath();ctx.fill();
  /* franja del modelo */
  ctx.globalAlpha=.55;ctx.fillStyle=T.stripe;ctx.fillRect(-hl+8,-1.5,L-16,3);ctx.globalAlpha=1;
  /* cabina */
  const ch=L*T.roof*.55, cw=hw*T.roof*1.15;
  ctx.fillStyle='#14121f';
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(-L*T.cab,-cw,ch,cw*2,4);ctx.fill();}else ctx.fillRect(-L*T.cab,-cw,ch,cw*2);
  ctx.fillStyle='rgba(40,231,255,.55)';ctx.fillRect(-L*T.cab+ch*.45,-cw*.72,3.5,cw*1.44);
  /* alerón */
  if(T.sp>0){ctx.fillStyle='#14121f';ctx.fillRect(-hl-2,-hw*1.02,3.5,hw*2.04);ctx.fillRect(-hl-6,-hw*(1+T.sp*.22),3,hw*2*(1+T.sp*.22));}
  /* luces */
  ctx.fillStyle='#fff3a0';ctx.fillRect(hl-8,-nw*.95,3,nw*.55);ctx.fillRect(hl-8,nw*.4,3,nw*.55);
  ctx.fillStyle='#ff2040';ctx.fillRect(-hl,-hw*.5,2,hw*.32);ctx.fillRect(-hl,hw*.18,2,hw*.32);
  ctx.restore();
  ctx.save();ctx.font='700 16px "Chakra Petch",sans-serif';ctx.textAlign='center';
  ctx.lineWidth=4;ctx.strokeStyle='rgba(11,10,20,.85)';ctx.strokeText(name,x,y-34);
  ctx.fillStyle=glow?'#28e7ff':'#f4f1ec';ctx.fillText(name,x,y-34);ctx.restore();
}
function drawFruit(x,y,rot,r,gold){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.globalAlpha=.3;ctx.fillStyle='#7cff6b';ctx.beginPath();ctx.arc(0,0,r*1.55,0,6.3);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle=gold?'#b8860b':'#1f8a44';ctx.beginPath();ctx.arc(0,0,r,0,6.3);ctx.fill();
  ctx.fillStyle=gold?'#ffd35e':'#39c96a';ctx.beginPath();ctx.arc(0,0,r*.9,0,6.3);ctx.fill();
  ctx.fillStyle=gold?'#ffb020':'#e8394f';ctx.beginPath();ctx.arc(0,0,r*.66,0,6.3);ctx.fill();
  ctx.fillStyle='#2a1020';
  for(let i=0;i<5;i++){const a2=i/5*6.283+rot*.4;ctx.beginPath();ctx.arc(Math.cos(a2)*r*.38,Math.sin(a2)*r*.38,r*.1,0,6.3);ctx.fill();}
  ctx.strokeStyle='#ffb020';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(r*.45,-r*1.5,r*.15,-r*1.9);ctx.stroke();
  ctx.fillStyle='#ffe45e';ctx.beginPath();ctx.arc(r*.15,-r*1.95,r*.2,0,6.3);ctx.fill();
  ctx.restore();
}
function angLerp(a,b,k){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return a+d*k;}

let hudCache={};
function setT(id,t){if(hudCache[id]!==t){hudCache[id]=t;$(id).textContent=t;}}
function setH(id,h){if(hudCache['h'+id]!==h){hudCache['h'+id]=h;$(id).hidden=h;}}

function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=theme.bg;ctx.fillRect(0,0,W,H);
  const base=Math.min(W,H)/700;
  if(S.mode==='menu'){
    S.demo+=dt*55;const i=((Math.floor(S.demo)%N)+N)%N;
    camx+=(pts[i][0]-camx)*Math.min(1,dt*3);camy+=(pts[i][1]-camy)*Math.min(1,dt*3);camS=base*.8;
  }else{
    const c=S.car,k=Math.min(1,Math.hypot(c.vx,c.vy)/430);
    const tx=c.x+c.vx*.28,ty=c.y+c.vy*.28;
    camx+=(tx-camx)*Math.min(1,dt*6);camy+=(ty-camy)*Math.min(1,dt*6);
    camS=base*(1-.16*k);
  }
  drawScenery();
  ctx.save();
  ctx.translate(W/2,H/2);ctx.scale(camS,camS);ctx.translate(-camx,-camy);
  for(const l of lights){ctx.globalAlpha=l[4];ctx.fillStyle=l[3];ctx.fillRect(l[0],l[1],l[2],l[2]);}
  ctx.globalAlpha=1;
  drawRoad();
  for(const q of parts){
    if(q.sp){ctx.globalAlpha=Math.max(0,q.l*2);ctx.fillStyle='#ffb020';ctx.fillRect(q.x,q.y,4,4);}
    else{ctx.globalAlpha=Math.max(0,q.l)*.6;ctx.fillStyle=q.c||'#d9d6e6';ctx.beginPath();ctx.arc(q.x,q.y,6+(1-q.l)*14,0,6.3);ctx.fill();}
  }
  ctx.globalAlpha=1;
  if(S.mode==='play'){
    for(const e of entries()){
      if(e.me) continue;
      let r=R[e.id];if(!r){r=R[e.id]={x:e.x,y:e.y,a:e.a};}
      const k=Math.min(1,dt*12);r.x+=(e.x-r.x)*k;r.y+=(e.y-r.y)*k;r.a=angLerp(r.a,e.a,k);
      drawCar(r.x,r.y,r.a,e.c,e.n,false,e.k,e.b>0,false);
    }
    /* cajas de frutas sobre la pista */
    const bt=performance.now()/1000;
    for(let bi=0;bi<boxes.length;bi++){
      const b=boxes[bi], p=pts[b.i], t=tg[b.i];
      const left=(S.host||S.practice)?b.ms:((S.bx[bi]||0)*100);
      drawBox(p[0]-t[1]*b.lat, p[1]+t[0]*b.lat, left, !!b.gold, bt);
    }
    drawCar(S.car.x,S.car.y,S.car.a,S.color,S.name,true,S.carType,S.slow>0,S.nitro>0);
    for(let i=bombsV.length-1;i>=0;i--){
      const b=bombsV[i];b.t+=dt;
      if(b.t>=b.dur){
        for(let j=0;j<9;j++) parts.push({x:b.x1,y:b.y1,vx:(Math.random()-.5)*230,vy:(Math.random()-.5)*230,l:.75,c:'#7cff6b'});
        bombsV.splice(i,1);continue;
      }
      const k=Math.min(1,b.t/b.dur);
      const x=b.x0+(b.x1-b.x0)*k, y=b.y0+(b.y1-b.y0)*k-Math.sin(Math.PI*k)*130;
      drawFruit(x,y,b.t*10,(10+k*4)*(b.gold?2:1),b.gold);
    }
  }
  ctx.restore();
  if(S.mode==='play') hud();
}

let lastRoster=0;
function hud(){
  const g=S.game,now=ntime(),adm=canAdmin();
  const list=entries();
  const pos=list.findIndex(e=>e.me)+1;
  setT('lap','Vuelta '+Math.min(Math.max(S.lap,1),LAPS)+'/'+LAPS);
  setT('pos',pos+'º de '+list.length);
  setT('spd',String(Math.round(Math.hypot(S.car.vx,S.car.vy)*.5)));
  const rem=g.state==='race'?g.startAt-now:1e9;
  let b='';
  if(g.state==='race'){if(rem>0)b=String(Math.ceil(rem/1000));else if(rem>-900)b='¡Ya!';}
  setT('banner',b);
  const it=S.item, code=itemCode(it);
  setT('bombN',it?'1':'0');
  setT('bombIcon',itemEmoji(it));
  if(hudCache.it!==code){
    hudCache.it=code;
    $('bBomb').classList.toggle('ready',!!it);
    $('bBomb').classList.toggle('gold',!!(it&&it.g));
    $('bBomb').setAttribute('aria-label', it?('Usar '+itemLabel(it)):'Sin fruta');
  }
  const tags=[];
  if(S.slow>0) tags.push('🍉 Ralentizado · '+Math.round(S.slow/N*100)+'% de vuelta');
  if(S.flip>0) tags.push('🌀 Volante invertido · '+S.flip.toFixed(1)+'s');
  if(S.nitro>0) tags.push('⚡ Turbo · '+S.nitro.toFixed(1)+'s');
  setT('slowTag',tags.join('   '));
  setH('slowTag',!tags.length);
  setH('bBomb',S.mode!=='play');
  setT('trackName',(S.practice?'Práctica · ':'')+'Pista: '+TRACKS[S.game.track].n);
  const lobby=g.state==='lobby';
  setH('bar',!lobby);
  setH('startBtn',!(lobby&&adm));
  setH('waitNote',!(lobby&&!adm));
  setH('abort',!(g.state==='race'&&adm));
  setH('results',!S.fin);
  setH('againBtn',!(S.fin&&adm));
  setH('tracks',!(lobby&&adm));
  if(lobby&&adm) document.querySelectorAll('.trk').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.i===S.game.track)));
  if(performance.now()-lastRoster>700){lastRoster=performance.now();renderRoster();}
  if(S.fin){
    const key=list.map(e=>e.n+e.f+e.t).join('|');
    if(hudCache.res!==key){
      hudCache.res=key;const ol=$('resList');ol.textContent='';
      for(const e of list){const li=document.createElement('li');li.appendChild(document.createTextNode(e.n));
        const sp=document.createElement('span');sp.textContent=e.f?fmt(e.t):'en pista';li.appendChild(sp);ol.appendChild(li);}
    }
  }
}

/* ================= controles ================= */
const KEYS={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',Space:'brake'};
addEventListener('keydown',e=>{if(e.code==='KeyE'&&S.mode==='play'){useItem();e.preventDefault();return;}const k=KEYS[e.code];if(k&&S.mode==='play'){kb[k]=1;e.preventDefault();}});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(k){kb[k]=0;}});
addEventListener('blur',()=>{for(const k in kb)kb[k]=0;for(const k in tc)tc[k]=0;stickReset();});
/* palanca analógica: el desplazamiento del knob da el giro, con retorno elástico */
let stickAxis=()=>0, stickReset=()=>{};
(function(){
  const base=$('stick'), knob=$('knob');
  let pid=null, R=40, cx=0, cy=0, ax=0;
  function place(dx,dy){
    knob.style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px)';
    ax=Math.max(-1,Math.min(1,dx/R));
    if(Math.abs(ax)<.08) ax=0;      /* zona muerta: el auto no vibra centrado */
  }
  function move(e){
    if(pid===null||e.pointerId!==pid) return;
    let dx=e.clientX-cx, dy=e.clientY-cy;
    const d=Math.hypot(dx,dy);
    if(d>R){dx=dx/d*R;dy=dy/d*R;}   /* tope circular, como una palanca real */
    place(dx,dy);
  }
  function reset(){
    pid=null;ax=0;base.classList.remove('on');knob.classList.add('snap');
    knob.style.transform='translate(0px,0px)';
    setTimeout(()=>knob.classList.remove('snap'),200);
  }
  base.addEventListener('pointerdown',e=>{
    e.preventDefault();try{base.setPointerCapture(e.pointerId);}catch(_){}
    const r=base.getBoundingClientRect();
    cx=r.left+r.width/2;cy=r.top+r.height/2;
    R=Math.max(20,r.width/2-30);    /* el knob no se escapa del aro */
    pid=e.pointerId;base.classList.add('on');knob.classList.remove('snap');
    move(e);
    try{if(navigator.vibrate)navigator.vibrate(8);}catch(_){}
  });
  base.addEventListener('pointermove',move);
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>
    base.addEventListener(t,e=>{if(e.pointerId===pid)reset();}));
  base.addEventListener('contextmenu',e=>e.preventDefault());
  stickAxis=()=>ax;stickReset=reset;
})();
function bind(id,key){
  const el=$(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}tc[key]=1;el.classList.add('on');});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,()=>{tc[key]=0;el.classList.remove('on');}));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
bind('bG','gas');bind('bB','brake');
$('bBomb').addEventListener('pointerdown',e=>{e.preventDefault();useItem();});
$('bBomb').addEventListener('contextmenu',e=>e.preventDefault());
$('tracks').addEventListener('click',e=>{const b=e.target.closest('.trk');if(b)setTrack(+b.dataset.i);});

/* ================= que no se active el zoom ================= */
/* iOS ignora user-scalable=no: hay que bloquear los gestos a mano */
['gesturestart','gesturechange','gestureend'].forEach(t=>
  document.addEventListener(t,e=>{e.preventDefault();},{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
/* doble toque rápido sobre la pista (no sobre un botón) tampoco hace zoom */
let lastTap=0;
document.addEventListener('touchend',e=>{
  const now=e.timeStamp||performance.now();
  const hit=e.target&&e.target.closest?e.target.closest('button,input,.stick,.tb,.carSel,.trk,summary'):null;
  if(!hit&&now-lastTap<340&&e.cancelable) e.preventDefault();
  lastTap=now;
},{passive:false});

/* ================= bucle ================= */
let last=performance.now();
function frame(t){
  const dt=Math.max(0,Math.min(.05,(t-last)/1000||.016));last=t;
  if(S.mode==='play') update(dt);
  render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* en celular, cambiar de app dispara pagehide: no cerramos la sala para no matarla */
addEventListener('pagehide',e=>{ if(!e.persisted && !S.host && !hostConn) cleanupNet(); });
})();
